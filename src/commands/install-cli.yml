---
description: >
  Installs the standalone Cloudsmith CLI binary on Linux or macOS executors.
  The installer is bundled with the published orb and verifies the downloaded
  archive against its SHA-256 checksum. The CLI directory is added to PATH for
  subsequent steps via $BASH_ENV. Optional API configuration parameters are
  written to the CLI config file (~/.cloudsmith/config.ini).
parameters:
  cli-version:
    type: string
    default: "latest"
    description: >
      Exact Cloudsmith CLI version to install (e.g. "1.20.0"), or "latest"
      for the newest release.
  install-path:
    type: string
    default: ""
    description: >
      Absolute path to the root directory for versioned CLI installations.
      Leave empty to use the default ($XDG_DATA_HOME/cloudsmith-cli or
      $HOME/.local/share/cloudsmith-cli).
  api-host:
    type: string
    default: ""
    description: >
      Override the Cloudsmith API host (api_host in config.ini). Leave empty
      to use the default (api.cloudsmith.io).
  api-proxy:
    type: string
    default: ""
    description: >
      HTTP/HTTPS proxy URL for Cloudsmith API calls (api_proxy in config.ini).
      Leave empty for no proxy.
  api-ssl-verify:
    type: boolean
    default: true
    description: >
      Enable or disable SSL certificate verification for Cloudsmith API calls
      (api_ssl_verify in config.ini).
  api-user-agent:
    type: string
    default: ""
    description: >
      Custom user-agent string sent with Cloudsmith API requests
      (api_user_agent in config.ini). Leave empty to use the default.
steps:
  - run:
      name: Download and verify Cloudsmith CLI
      environment:
        CLOUDSMITH_CLI_VERSION: <<parameters.cli-version>>
        CLOUDSMITH_CLI_INSTALL_ROOT: <<parameters.install-path>>
        CLOUDSMITH_CLI_OUTPUT_FILE: /tmp/cloudsmith-cli-install/result.txt
      command: <<include(scripts/install.sh)>>
  - run:
      name: Add Cloudsmith CLI to PATH
      # The default shell is chosen when the container starts, so bash
      # installed by an earlier step is not picked up without this.
      shell: /bin/bash
      environment:
        CLOUDSMITH_CLI_OUTPUT_FILE: /tmp/cloudsmith-cli-install/result.txt
        PARAM_API_HOST: <<parameters.api-host>>
        PARAM_API_PROXY: <<parameters.api-proxy>>
        PARAM_API_SSL_VERIFY: <<parameters.api-ssl-verify>>
        PARAM_API_USER_AGENT: <<parameters.api-user-agent>>
      command: <<include(scripts/post-install.sh)>>
