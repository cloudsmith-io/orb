description: >-
  Legacy workflow — authenticate with a static API key and use the deprecated
  publish command. For new projects prefer the OIDC-based approach shown in
  the cli-with-oidc example.
usage:
  version: 2.1

  orbs:
    cloudsmith: cloudsmith/cloudsmith@2.0.0

  workflows:
    cloudsmith_publish:
      jobs:
        - publish

  jobs:
    publish:
      executor:
        cloudsmith/default
      steps:
        - checkout
        - cloudsmith/ensure-api-key
        - cloudsmith/install-cli
        - run:
            name: Build Python package
            command: |
              pip install build
              python -m build --wheel
        - cloudsmith/publish:
            cloudsmith-repository: cloudsmith/examples
            package-path: dist/*.whl
            package-format: python
